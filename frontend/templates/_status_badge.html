{% comment %}
Status pill. Call with the raw status and its display label:
    {% include "_status_badge.html" with status=appt.status label=appt.get_status_display %}
Colours come straight from the Figma tables.
{% endcomment %}
<span class="inline-flex items-center rounded-full px-2.5 py-1 text-[12px]
  {% if status == 'CONFIRMED' %}bg-[#E8F1FC] text-[#1666C4]
  {% elif status == 'PENDING' %}bg-[#FEF3C7] text-[#D97706]
  {% elif status == 'COMPLETED' %}bg-[#DCFCE7] text-[#16A34A]
  {% elif status == 'NO_SHOW' %}bg-[#FEE2E2] text-[#DC2626]
  {% else %}bg-[#F1F5F9] text-[#64748B]{% endif %}" style="font-weight:500;">{{ label }}</span>
