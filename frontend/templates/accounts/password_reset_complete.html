{% extends 'base.html' %}

{% block title %}Password changed · Smart OPD{% endblock %}

{% block body %}
<main class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-md rounded-xl border border-[#E2E8F0] bg-white p-6 text-center shadow-sm">
    <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-[#E8F1FC] text-[#0FA3A3]">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4 10-10"/></svg>
    </span>

    <h1 class="mt-4 text-[24px]" style="font-weight:600;">Password changed</h1>
    <p class="mt-2 text-[14px] text-[#64748B]">You can now log in with your new password.</p>

    <a href="{% url 'accounts:login' %}" class="mt-6 inline-flex h-10 items-center justify-center rounded-lg bg-[#1666C4] px-4 text-[14px] text-white hover:bg-[#1155A6]" style="font-weight:600;">Log in</a>
  </div>
</main>
{% endblock %}
