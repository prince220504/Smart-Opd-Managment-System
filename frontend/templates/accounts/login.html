{% extends 'base.html' %}

{% block title %}Log in · Smart OPD{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">
    <div class="rounded-xl border border-[#E2E8F0] bg-white p-6 shadow-sm">
      <h1 class="text-[24px]" style="font-weight:600;">Log in</h1>
      <p class="mt-1 text-[14px] text-[#64748B]">Access your account.</p>

      {% if error %}
      <div class="mt-4 rounded-lg border-l-[3px] border-[#DC2626] bg-[#FEF2F2] px-4 py-3">
        <p class="text-[14px] text-[#1A2333]">{{ error }}</p>
      </div>
      {% endif %}

      <form action="{% url 'accounts:login' %}" method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        <div>
          <label for="username" class="block text-[13px] text-[#1A2333]" style="font-weight:500;">Username <span class="text-[#DC2626]">*</span></label>
          <input id="username" name="username" type="text" required autofocus
                 class="mt-1.5 h-10 w-full rounded-lg border border-[#E2E8F0] px-3 text-[14px]"
                 placeholder="your username">
        </div>
        <div>
          <label for="password" class="block text-[13px] text-[#1A2333]" style="font-weight:500;">Password <span class="text-[#DC2626]">*</span></label>
          <input id="password" name="password" type="password" required
                 class="mt-1.5 h-10 w-full rounded-lg border border-[#E2E8F0] px-3 text-[14px]"
                 placeholder="••••••••">
        </div>
        <button type="submit" class="inline-flex h-10 w-full items-center justify-center rounded-lg bg-[#1666C4] px-4 text-[14px] text-white hover:bg-[#1155A6]" style="font-weight:600;">Log in</button>
      </form>

      <div class="mt-4 text-center">
        <span class="text-[14px] text-[#64748B]">New patient? </span>
        <a href="{% url 'accounts:register' %}" class="text-[14px] text-[#1666C4] hover:text-[#1155A6]" style="font-weight:500;">Register as Patient</a>
      </div>

      <p class="mt-4 border-t border-[#E2E8F0] pt-4 text-[13px] text-[#64748B]">
        Hospital staff: log in with the account given to you.
      </p>
    </div>
  </div>
</div>
{% endblock %}
