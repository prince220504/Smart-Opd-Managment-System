{% if messages %}
<div id="flash" class="mb-6 space-y-3">
  {% for message in messages %}
  <div class="flex items-start justify-between gap-3 rounded-lg border-l-[3px] px-4 py-3
       {% if 'error' in message.tags or 'danger' in message.tags %}border-[#DC2626] bg-[#FEF2F2]
       {% elif 'warning' in message.tags %}border-[#D97706] bg-[#FFFBEB]
       {% else %}border-[#1666C4] bg-[#E8F1FC]{% endif %}">
    <p class="text-[14px] text-[#1A2333]">{{ message }}</p>
    <button type="button" onclick="this.parentElement.remove()" class="shrink-0 text-[#64748B] hover:text-[#1A2333]" aria-label="Dismiss">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}
